# CD: after CI passes on main, our own server (a self-hosted GitHub runner) runs deploy/deploy.sh:
# it updates ~/Desktop/Comilla-University-Hackathon to main, rebuilds the backend image and restarts
# it with Docker Compose. See docs/deploy.md.
#
# Safety: this job runs on our machine, so it only ever runs for pushes to main in this repository
# (never for pull requests or forks) and the server keeps its own .env; no secrets live in GitHub.

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # "Run workflow" button: redeploy main by hand

concurrency:
  group: deploy
  cancel-in-progress: false # never stop a deploy halfway

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to the server
    if: >-
      github.repository == 'Tamim2276/Comilla-University-Hackathon' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: [self-hosted, linux, ekcall]
    timeout-minutes: 40
    steps:
      # Only to get deploy.sh itself; the script deploys from the project folder on the server.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy
        run: bash deploy/deploy.sh # bash: works even if the file lost its executable bit

# Data services for Ek Call: Postgres (history, logs, answer cache) and Chroma (document search).
# The backend and the app still run on the machine for now; they reach these on localhost.
#
# Run from backend/:
#   docker compose up -d        start (data stays in the named volumes between restarts)
#   docker compose ps           both should say "healthy"
#   docker compose down         stop (add -v ONLY to delete all data)
#
# POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB come from backend/.env (Compose reads the .env next to
# this file; see .env.example). Ports listen on 127.0.0.1 only, so other machines cannot reach them.

name: ekcall

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in backend/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  chroma:
    # Must match chromadb in requirements.txt: the client refuses a different server version.
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "127.0.0.1:8001:8000" # 8000 on the host is the backend
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf \"GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  chroma-data:
